name: Validate and publish notebook learning paths

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

concurrency:
  group: notebook-learning-path-publish
  cancel-in-progress: true

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the notebook library
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install notebook dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m ipykernel install --user --name notebook-blog --display-name "Python (Notebook Blog)"

      - name: Generate learning plans and notebook paths
        run: |
          python scripts/generate_overviews.py
          python scripts/generate_curriculum_library.py

      - name: Validate every course, plan, path, and notebook
        run: |
          python scripts/validate_python_course.py
          python scripts/validate_curriculum_library.py

      - name: Ensure generated curriculum is committed
        run: git diff --exit-code

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
