format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    code-fold: show
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true

execute:
  enabled: true
  warning: false
  error: false

jupyter: notebook-blog
